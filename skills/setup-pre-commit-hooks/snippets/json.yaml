# files: and exclude: are set interactively via JSON Scope Selection (see SKILL.md).
# The pattern below is the narrowest default (tier 1: .claude/ only).
# When installed by the skill, this line is replaced with the user-selected pattern.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: pretty-format-json
        args: ["--autofix"]
        files: '(^|/)\.claude/.*\.json$'
