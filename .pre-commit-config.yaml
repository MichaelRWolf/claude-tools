repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=102400"] # 100MB
      - id: pretty-format-json
        args: ["--autofix"]
        files: '(^|/)\.(claude|vscode)/.*\.json$|(^|/)\.markdownlint\.json$'

  - repo: local
    hooks:
      - id: markdown-table-formatter
        name: markdown-table-formatter (align columns)
        entry: npx markdown-table-formatter
        language: system
        types: [markdown]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.0
    hooks:
      - id: markdownlint-fix
        # companion: .markdownlint.json must include "MD060": false
        # MD060 (table-column-style) conflicts with markdown-table-formatter output style

  - repo: https://github.com/sirosen/texthooks
    rev: 0.7.1
    hooks:
      - id: fix-ligatures
        types: [markdown]
      - id: fix-smartquotes
        types: [markdown]
      - id: fix-unicode-dashes
        types: [markdown]
